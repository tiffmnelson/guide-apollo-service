# Site metadata
title: Australian Apollo Service
description: Web-based genome curation and editing tools for Australian researchers
url: https://tiffmnelson.github.io/guide-apollo-service

# Repository info
repository: tiffmnelson/guide-apollo-service
baseurl: /guide-apollo-service

# Theme
remote_theme: ELIXIR-Belgium/elixir-toolkit-theme@2.2.0

# Build settings
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

# Exclude files
exclude:
  - README.md
  - CHANGELOG.md
  - LICENSE
  - skills/
  - .gitignore
